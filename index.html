<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Симулятор парикмахера — Академия Льва Кравца</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Парикмахер">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d4fd8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. Compact HUD, cropped salon stage with large sprites, dialogue box with big emotion portrait, scrolling choice panel. Chamomile palette: sage neutrals, yellow accent, violet for Aya. */
:root{
  --bg:#edf1ec; --surface:#ffffff; --surface-2:#f4f7f3; --ink:#1c2620; --muted:#5b6a61; --line:#d4ddd5;
  --accent:#e2b22a; --accent-ink:#3b2c00; --leaf:#3e6b51; --leaf-soft:#dfeae2;
  --bad:#b8443a; --bad-soft:#f6e1de; --aya:#6a4fb0; --aya-soft:#ece6f8;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1b231e; --surface-2:#212b25; --ink:#e7ede8; --muted:#9aa89f; --line:#2f3b34;
  --accent:#e8c04a; --accent-ink:#2a1f00; --leaf:#80b596; --leaf-soft:#22352a;
  --bad:#e57b6f; --bad-soft:#3a2220; --aya:#b9a2f0; --aya-soft:#2a2440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1b231e; --surface-2:#212b25; --ink:#e7ede8; --muted:#9aa89f; --line:#2f3b34;
  --accent:#e8c04a; --accent-ink:#2a1f00; --leaf:#80b596; --leaf-soft:#22352a;
  --bad:#e57b6f; --bad-soft:#3a2220; --aya:#b9a2f0; --aya-soft:#2a2440; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden}
.wrap{max-width:1080px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:0 12px calc(8px + env(safe-area-inset-bottom,0px))}
.hud{flex:none;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;margin-right:auto;white-space:nowrap}
.flower{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.stat{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:10px;margin-right:4px}
.cred{display:flex;align-items:center;gap:6px;flex:1;min-width:90px;max-width:260px}
.cred span{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .4s}
.bar i.low{background:var(--bad)}
.cred b{font-variant-numeric:tabular-nums;min-width:3ch;text-align:right;font-size:13px}
.fs{all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.fs:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stage{position:relative;flex:0 0 auto;height:min(50dvh, 60vw, 540px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#cfdcc5;cursor:pointer;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:100%}
.sign{font-family:var(--display);font-weight:700}
.aya{position:absolute;right:8px;top:8px;z-index:6;width:clamp(54px,9vw,92px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 22px 6px rgba(138,107,224,.5);animation:float 3s ease-in-out infinite;background:#fff}
.aya img{width:100%;height:100%;object-fit:cover;object-position:center top}
.aya.talk{animation:float 3s ease-in-out infinite,pulse .5s ease-in-out infinite alternate}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes pulse{to{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 34px 12px rgba(138,107,224,.8)}}
.clock{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(20,30,24,.4);opacity:0;transition:opacity .3s;pointer-events:none}
.clock.on{opacity:1}
.clock div{background:#fffef9;color:#1c2620;border-radius:16px;padding:12px 18px;font-family:var(--display);font-size:clamp(15px,3vw,20px);text-align:center;border:2px solid #1c2620}
.clock small{display:block;font-family:var(--body);font-size:13px;color:#5b6a61;margin-top:2px}

.panel{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.head h1{font-family:var(--display);font-weight:500;font-size:clamp(15px,3.6vw,19px);margin:0;text-wrap:balance}
.head .step{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.line{margin:0;font-size:16px;color:var(--muted)}
.line b{color:var(--ink)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:15px;line-height:1.38;transition:border-color .15s}
.choice:hover{border-color:var(--leaf)}
.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.choice .k{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.choice.picked{border-color:var(--accent);background:var(--surface-2)}
.choice[disabled]{cursor:default}
.choice[disabled]:not(.picked){opacity:.4}
.timer{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.chip.minus{background:var(--bad-soft);color:var(--bad)}
.chip.plus{background:var(--leaf-soft);color:var(--leaf)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--aya-soft);border-radius:var(--r);padding:10px 14px;font-size:15px}
.hint b{color:var(--aya)}
.toast{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:8px 12px;font-weight:600;font-size:14px}
.next{all:unset;cursor:pointer;align-self:flex-end;font-family:var(--display);font-weight:500;font-size:15px;background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px}
.next:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wait{font-size:14px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-family:var(--display);font-weight:500;font-size:16px;margin:0 0 8px}
.card p{margin:0 0 8px}
.card ul{margin:0;padding-left:20px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
tr.total td{border-bottom:0;font-weight:700}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.skill{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.skill span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.skill b{font-size:19px;font-variant-numeric:tabular-nums}

/* спрайты */
.spr .bob{transform-box:fill-box;transform-origin:50% 100%}
.spr.walking .bob{animation:bob .26s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-1.2deg)}to{transform:translateY(-7px) rotate(1.2deg)}}
.spr.busy .bob{animation:busy .35s ease-in-out infinite alternate}
@keyframes busy{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.spr.talking .bob{animation:talk .45s ease-in-out infinite alternate}
@keyframes talk{to{transform:translateY(-2px)}}
.spr:not(.walking):not(.busy):not(.talking) .bob{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.006)}}
.spr .shadow{fill:rgba(60,40,20,.22)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:560px){ .hud{gap:8px} .cred span,.stat .lg,.bname{display:none} .stage{height:min(50dvh,100vw)} .choice{font-size:14px} .next{padding:9px 18px} }
@media (min-width:900px){ .stage{height:min(56dvh,560px)} }

/* варианты ответа — тоже пузыри */
.choice{background:#fffef9;color:#1c2620;border:2px solid #c9d3ca;border-radius:20px 20px 20px 6px;position:relative}
.choice:hover{border-color:#1c2620}
.choice.picked{border-color:#e2b22a;background:#fff7dc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .choice{background:var(--surface);color:var(--ink);border-color:var(--line)}}

/* пузырь реплики поверх сцены */
.dlg{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;max-height:52%;overflow:auto;display:flex;gap:10px;align-items:center;background:#fffef9;color:#1c2620;border:2px solid #1c2620;border-radius:20px;padding:8px 12px 8px 8px;box-shadow:0 4px 14px rgba(0,0,0,.22);visibility:hidden;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s,visibility 0s .18s}
.dlg.on{visibility:visible;opacity:1;transform:none;transition:opacity .18s,transform .18s}
.dlg.up{overflow:visible}
.dlg::before{content:"";position:absolute;width:16px;height:16px;background:inherit;border:2px solid;border-color:inherit;border-right:0;border-bottom:0;border-radius:3px 0 0 0}
.dlg.up::before{top:-10px;left:var(--tail,50%);transform:translateX(-50%) rotate(45deg)}
.dlg.side-l{left:36%}
.dlg.side-l::before{left:-10px;bottom:22px;transform:rotate(-45deg)}
.dlg.side-r{right:40%}
.dlg.side-r::before{right:-10px;bottom:22px;transform:rotate(135deg)}
.dlg.is-narr::before{display:none}
.dlg .por{flex:none;width:clamp(44px,11vw,64px);aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:50% 15%;border:3px solid #e2b22a;background:#dfe5df}
.dlg .txt{min-width:0;display:flex;flex-direction:column}
.dlg .who{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5b6a61}
.dlg .say{font-size:clamp(13px,3.6vw,16px);line-height:1.32}
.dlg .photo{height:84px;width:auto;border-radius:6px;margin-top:4px;align-self:flex-start}
.dlg.is-aya{background:#f3eefc;border-color:#6a4fb0}
.dlg.is-aya .who{color:#6a4fb0}
.dlg.is-narc{border-color:#7a2f2a;background:#fff6f2}
.dlg.is-narc .who{color:#7a2f2a}
.dlg.is-narr{background:rgba(28,38,32,.92);color:#fffef9;border-color:#1c2620;font-style:italic;padding:8px 14px}
.dlg.more::after{content:"▸";position:absolute;right:10px;bottom:4px;font-size:13px;opacity:.5;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#stage:has(#bust.on.round) #aya{opacity:0}
.aya{transition:opacity .3s}
/* всплывающие Айя, директор и администратор */
.bust{position:absolute;bottom:0;z-index:5;height:58%;pointer-events:none;transform:translateY(110%);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.bust img{height:100%;width:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.bust.left{left:1%}
.bust.right{right:0}
.bust.on{transform:none}
.bust.round{height:34%;bottom:10px;left:10px;aspect-ratio:1}
.bust.round img{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 22px 6px rgba(138,107,224,.55);filter:none;transform:none}
/* таймер ответа */
.tmr{position:absolute;top:8px;left:8px;z-index:7;font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;background:rgba(255,254,249,.94);color:#1c2620;border:2px solid #1c2620;border-radius:99px;padding:6px 11px;display:none}
.tmr.on{display:block}
.tmr.low{background:#b8443a;color:#fff;border-color:#b8443a;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.timer{height:8px!important;flex:none}
.timer.low i{background:var(--bad)!important}

/* работа над ошибками */
.note{font-size:13px;color:var(--muted);margin:0 0 8px!important}
details.skill{padding:0}
details.skill summary{list-style:none;cursor:pointer;padding:8px 10px;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 8px}
details.skill summary::-webkit-details-marker{display:none}
details.skill summary span{grid-column:1/-1}
details.skill summary em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
details.skill.has-bad summary em{color:var(--bad)}
details.skill[open]{grid-column:1/-1}
details.skill[open] summary{border-bottom:1px solid var(--line)}
.review{list-style:none;margin:0;padding:6px 10px 10px;display:flex;flex-direction:column;gap:8px}
.review li{font-size:14px;line-height:1.4;padding-left:10px;border-left:3px solid var(--leaf)}
.review li.bad{border-left-color:var(--bad)}
.review li.none{border:0;padding:0;color:var(--muted)}
.review .rt{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.review li.bad .rt{color:var(--bad)}
.review .rb{color:var(--leaf);font-weight:600;margin-top:2px}
.review .ra{color:var(--aya);margin-top:2px}

.choice .k{display:none}
.choice{padding:8px 12px}

/* шкала настроения: от −100 до +100, ноль посередине, красная зона ухода −80 */
.thermo{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,rgba(184,68,58,.35) 0 10%,var(--surface-2) 10% 100%);border:1px solid var(--line);overflow:hidden}
.thermo::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted);transform:translateX(-50%)}
.thermo i{position:absolute;top:0;bottom:0;display:block;transition:left .45s,width .45s;width:0;left:50%}
.thermo i.pos{background:var(--leaf)}
.thermo i.neg{background:#d98a3d}
.thermo i.neg.low{background:var(--bad)}
.cred b{min-width:4ch}
.meterEnd{margin-top:10px}
.meterEnd .mt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.meterEnd .mt b{color:var(--ink);font-size:16px}
.meterEnd p{margin:6px 0 0;font-size:14px}

.snd{padding:5px 9px;font-size:14px}

.btnrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.next.alt{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}


.fs.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
@media (max-width:560px){ #rstBtn{padding:5px 8px} #fsBtn{display:none} }
@media (max-width:560px){ .stat span{display:none} .hud{gap:6px} .fs{padding:5px 8px} }
.snd.off{opacity:.45;text-decoration:line-through}

/* пролог: карточки салонов, мультивыбор, талон */
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.segs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px;font-size:13px;line-height:1.3;color:var(--ink)}
.seg:hover{border-color:var(--leaf)}
.seg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg.rec{border-color:#8a6be0}
.seg.picked{border-color:var(--accent);background:var(--surface-2)}
.seg[disabled]{cursor:default}.seg[disabled]:not(.picked){opacity:.45}
.seg .pic{aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.seg .pic img{width:100%;height:100%;object-fit:cover;display:block}
.seg .pic.none{background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,transparent 10px 20px)}
.seg b{font-size:14px}
.seg .lv{color:var(--muted);font-size:12px}
.seg .ds{font-size:12px}
.choices.multi .choice.picked::after{content:"✓";margin-left:auto;font-weight:700;color:var(--accent)}
.talon{display:flex;flex-direction:column;gap:4px;border:2px dashed #8a6be0;border-radius:14px;padding:12px 16px;background:var(--surface);margin-bottom:10px}
.talon .tl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8a6be0;font-weight:700}
.talon b{font-family:var(--display);font-weight:500;font-size:18px}
table.offer{width:100%;table-layout:fixed;border-collapse:collapse}
table.offer td{vertical-align:top;padding:5px 6px;font-size:13px;white-space:normal;overflow-wrap:anywhere;width:50%;border-top:1px solid var(--line)}
table.offer td:last-child{color:var(--muted);text-align:left;font-weight:400}

.hud{position:relative}
.musPop{position:absolute;right:8px;top:calc(100% + 6px);z-index:30;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;font-weight:600;color:var(--ink)}
.musPop[hidden]{display:none}
.musPop input{width:min(180px,45vw);accent-color:var(--accent)}
.musPop b{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}

.next.big{display:block;width:100%;box-sizing:border-box;text-align:center;font-size:17px;padding:14px 18px;margin:2px 0 8px}
.lead{margin:0 0 12px;font-size:14px;line-height:1.45}
.modes{margin:6px 0 6px;font-size:13px;color:var(--muted)}
.btnrow.left{justify-content:flex-start}

/* выбор героя — яркие карточки в духе Brawl Stars */
.heroSel{background:radial-gradient(120% 90% at 50% 0%,#3f7bff 0%,#1b3ea8 55%,#10226b 100%);border-radius:18px;padding:12px 10px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.hsTitle{font-family:var(--display);font-weight:700;font-size:22px;text-align:center;color:#ffd21f;text-transform:uppercase;letter-spacing:.04em;-webkit-text-stroke:1.5px #1a1a1a;paint-order:stroke fill;text-shadow:0 3px 0 #1a1a1a}
.hsRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hsCard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:8px 8px 10px;border-radius:16px;border:3px solid #111;box-shadow:0 5px 0 #111;color:#fff;transition:transform .12s, box-shadow .12s;position:relative;min-width:0}
.hsCard.kira{background:linear-gradient(180deg,#ff7ac8 0%,#b03b9c 60%,#6d1f68 100%)}
.hsCard.eric{background:linear-gradient(180deg,#5cf06a 0%,#1f8a3a 55%,#0e3b1d 100%)}
.hsCard:hover{transform:translateY(-2px)}
.hsCard:focus-visible{outline:3px solid #ffd21f;outline-offset:3px}
.hsCard.on{border-color:#ffd21f;box-shadow:0 0 0 3px #ffd21f,0 6px 0 #111;transform:translateY(-3px)}
.hsCard[disabled]{cursor:default}
.hsArt{height:clamp(120px,22vh,200px);display:flex;justify-content:center;align-items:flex-end;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));border-radius:12px}
.hsArt img{height:100%;width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.hsName{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;-webkit-text-stroke:1.2px #111;paint-order:stroke fill;text-shadow:0 2px 0 #111}
.hsCls{align-self:flex-start;background:#111;color:#ffd21f;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px}
.hsEdu{font-size:12px;font-weight:700;opacity:.95}
.hsStats{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.hsStat{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:700}
.hsStat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsStat i{display:flex;gap:2px;flex:none}
.hsStat b{width:9px;height:10px;border-radius:2px;background:rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.4)}
.hsStat b.on{background:#ffd21f;border-color:#111}
.hsNote{font-size:11px;line-height:1.3;opacity:.92;margin-top:2px}
.hsPlay{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;color:#1a1a1a;background:linear-gradient(180deg,#ffe45c,#ffbf00);border:3px solid #111;border-radius:14px;padding:11px 16px;box-shadow:0 5px 0 #111}
.hsPlay:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hsPlay[disabled]{filter:grayscale(.8) brightness(.8);cursor:default}
.hsPlay:not([disabled]):active{transform:translateY(3px);box-shadow:0 2px 0 #111}
.seg.locked{opacity:.5;filter:grayscale(.7)}
.seg.locked .ds{color:var(--bad,#b33);font-weight:700}
@media (min-width:900px){.segs{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* HUD — плашки в духе Brawl Stars */
.hud{gap:7px;border-bottom:0;padding-bottom:4px;flex-wrap:nowrap}
.hudGap{flex:1}
.plate{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 26px;margin-left:12px;background:linear-gradient(180deg,#2e3a66,#1a2246);border:2px solid #0b0f1f;border-radius:9px;box-shadow:0 3px 0 #0b0f1f;color:#fff;white-space:nowrap;min-width:0}
.plate b{font-family:var(--display);font-weight:700;font-size:14px;line-height:1;font-variant-numeric:tabular-nums;-webkit-text-stroke:.6px #0b0f1f;paint-order:stroke fill;text-shadow:0 2px 0 #0b0f1f;min-width:0;text-align:right}
.plate .ico{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;border:2px solid #0b0f1f;box-shadow:0 3px 0 #0b0f1f;line-height:1}
.pMood{flex:1 1 170px;max-width:240px}
.pMood .ico{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc928);font-size:19px}
.pMood .pIn{flex:1;display:flex;flex-direction:column;gap:2px;min-width:40px}
.pMood .pLbl{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#aebbe8;line-height:1}
.pMood .thermo{height:8px;background:#0b0f1f;border:1px solid #0b0f1f}
.pMood .thermo::after{background:#aebbe8}
.pMood .thermo i.pos{background:linear-gradient(180deg,#7dff6a,#2fc34a)}
.pMood .thermo i.neg{background:linear-gradient(180deg,#ffb04a,#ff7a1a)}
.pMood .thermo i.neg.low{background:linear-gradient(180deg,#ff6a5a,#d4261b)}
.pMood b{min-width:3.2ch}
.pPts .ico{background:radial-gradient(circle at 35% 30%,#fff7b8,#ffb800);color:#7a3b00;font-size:18px}
.pMoney .ico{background:radial-gradient(circle at 35% 30%,#c9ffb3,#2fbf4a);color:#0b3d17;font-size:16px}
.pRank .ico{background:radial-gradient(circle at 35% 30%,#eef1f6,#8a93a6);color:#1a2246}
.pRank.r1 .ico{background:radial-gradient(circle at 35% 30%,#c7ccd3,#5f6670)}
.pRank.r2 .ico{background:radial-gradient(circle at 35% 30%,#eef4fa,#8ea3b8)}
.pRank.r3 .ico{background:radial-gradient(circle at 35% 30%,#ffd1a1,#b8692b)}
.pRank.r4 .ico{background:radial-gradient(circle at 35% 30%,#ffffff,#b9c2cc)}
.pRank.r5 .ico{background:radial-gradient(circle at 35% 30%,#fff2a8,#e0a800)}
.pRank.r6 .ico{background:radial-gradient(circle at 35% 30%,#e6fbff,#38c8f0)}
.pRank.r7 .ico{background:radial-gradient(circle at 35% 30%,#ffffff,#d8c7ff);box-shadow:0 3px 0 #0b0f1f,0 0 12px 3px rgba(255,255,255,.8)}
.pRank b{font-size:12px}
.hud .fs{background:linear-gradient(180deg,#3b4a80,#232c57);color:#fff;border:2px solid #0b0f1f;box-shadow:0 3px 0 #0b0f1f;border-radius:9px;padding:5px 9px;font-family:var(--display);font-weight:500}
.hud .fs:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0f1f}
.hud .fs.armed{background:linear-gradient(180deg,#ff6a5a,#d4261b)}
.hud .fs.snd.off{opacity:.6}
@media (max-width:700px){ .pRank b{display:none} .pRank{padding:0 6px 0 22px} .hud .fs#fsBtn{display:none} }
@media (max-width:560px){
  .hud{gap:4px}
  .plate{height:26px;padding:0 6px 0 20px;margin-left:10px}
  .plate .ico{width:28px;height:28px;left:-11px;font-size:14px}
  .pMood .ico{font-size:15px}
  .plate b{font-size:12px}
  .pMood{flex:1 1 90px}
  .pMood .pLbl{display:none}
  .hud .fs{padding:4px 7px;font-size:12px}
}
.pMood .thermo{flex:none;height:8px;width:100%}
@media (max-width:560px){ .plate{margin-left:14px} .pMood{flex:1 1 105px} .pMood .thermo{height:7px} .plate b{padding-right:1px} }
@media (max-width:560px){ .hudGap{display:none} .pMood{flex:0 1 auto} }
@media (max-width:440px){ .pMood .pIn{display:none} .pMood b{min-width:2.6ch} }
.seg.warn .ds{color:#c77a00;font-weight:700}

/* главное меню в стиле Brawl Stars */
.menuBS{background:radial-gradient(120% 90% at 50% 0%,#3f7bff 0%,#1b3ea8 55%,#10226b 100%);border-radius:18px;padding:14px 12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);margin-bottom:10px}
.mbSub{text-align:center;margin-top:-6px;color:#aebbe8;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.mbStart{font-size:18px;padding:14px 16px}
.mbLead{margin:0;color:#e9eeff;font-size:13px;line-height:1.45}
.mbLead b{color:#ffd21f}
.mbModes{color:#aebbe8;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.mbGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.mbGrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mbBtn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 10px 10px 50px;min-height:58px;justify-content:center;background:linear-gradient(180deg,#4d8bff,#2453c9);border:3px solid #0b0f1f;border-radius:14px;box-shadow:0 5px 0 #0b0f1f;color:#fff;transition:transform .1s}
.mbBtn:first-child{background:linear-gradient(180deg,#b06bff,#6a2fc9)}
.mbBtn:hover{transform:translateY(-2px)}
.mbBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b0f1f}
.mbBtn:focus-visible{outline:3px solid #ffd21f;outline-offset:2px}
.mbBtn[disabled]{filter:grayscale(.6) brightness(.85);cursor:default}
.mbBtn b{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.15;-webkit-text-stroke:.6px #0b0f1f;paint-order:stroke fill;text-shadow:0 2px 0 #0b0f1f}
.mbBtn .mbS{font-size:11px;font-weight:700;color:#dfe7ff;line-height:1.25}
.mbIco{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:radial-gradient(circle at 35% 30%,#fff7b8,#ffb800);border:2px solid #0b0f1f;box-shadow:0 3px 0 #0b0f1f;color:#1a1a1a}
.mbRank{display:flex;gap:6px;align-items:center;justify-content:center;color:#aebbe8;font-size:12px;font-weight:700}
.mbRank b{color:#ffd21f;font-family:var(--display)}
/* меню: пять режимов */
.mbGrid > .mbBtn:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:760px){.mbGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.mbGrid > .mbBtn:last-child:nth-child(odd){grid-column:auto}}
.mbGrid.menGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.mbGrid.menGrid > .mbBtn:last-child:nth-child(odd){grid-column:auto}
/* мужской зал */
.menStep{margin:0 0 6px;font-weight:700;font-size:14px;color:var(--ink-2,#555);text-transform:none}
.hint.best{background:rgba(46,160,90,.12)}
.hint.best b{color:#1f7a45}
/* плашка времени визита: сколько прошло минут от начала обслуживания */
.svcT{position:absolute;top:9px;left:84px;transform:translateY(-160%);z-index:6;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;background:linear-gradient(180deg,#2e3a66,#1a2246);border:2px solid #0b0f1f;border-radius:999px;box-shadow:0 3px 0 #0b0f1f;color:#fff;font-family:var(--display);font-size:13px;white-space:nowrap;transition:transform .3s;pointer-events:none}
.svcT.on{transform:none}
.svcT b{font-size:15px;font-variant-numeric:tabular-nums}
.svcT small{font-family:var(--body);font-size:11px;color:#aebbe8}
.svcT.over b{color:#ff9b8f}
.svcT.bump b{animation:tbump .5s}
@keyframes tbump{40%{transform:scale(1.35);color:#ffe36b}}
@media (max-width:560px){.svcT{font-size:11px;padding:3px 9px 3px 6px}.svcT b{font-size:13px}.svcT small{font-size:10px}}
.backBtn{display:block;margin:10px 0 0;background:none;border:0;color:var(--ink-2,#5b6a61);font:600 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.backBtn:hover{color:inherit}
ul.money{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:14px}
ul.money li{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed rgba(0,0,0,.12);padding-top:4px}
ul.money b{color:#1f7a45;white-space:nowrap}
/* главное меню: большая кнопка «Выбор салона» + 4 режима */
.mbSalon{display:flex;flex-direction:column;gap:4px;width:100%;text-transform:none;padding:16px 18px}
.mbSalon .mbBig{font-size:22px;text-transform:uppercase}
.mbSalon .mbS{font-family:var(--body,inherit);font-weight:600;font-size:13px;opacity:.8}
.mbStory{all:unset;cursor:pointer;display:block;text-align:center;margin:8px auto 14px;font-size:13px;text-decoration:underline;opacity:.75}
.mbStory:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.mbGrid.mb4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.mbGrid.mb4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mbGrid.mb4 > .mbBtn:last-child:nth-child(odd){grid-column:auto}
/* персонажи */
.chTabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chTab{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.chTab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.chTab:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
.chList{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.chList{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chCard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px}
.chPh{flex:0 0 84px;width:84px;height:104px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#eef3ea,#dfe8d8);border:2px solid var(--ink)}
.chPh.round{height:84px;border-radius:50%}
.chPh img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.chTx{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.4}
.chTx b{font-size:15px}
.chSub{color:var(--muted)}
.chWhere{font-size:12px;color:var(--muted)}
.chD{margin:4px 0 0}
.chT{margin:4px 0 0;font-size:12px;font-weight:600}
.chTx .hsStats{margin-top:6px;color:var(--ink)}
/* крупный план: кружок Айи не закрывает персонажей */
#stage.zoomed #aya{opacity:0;pointer-events:none}
.chTx .hsStats{max-width:240px}
.mbStory{color:#fff}

.chTx .hsStat b{background:var(--surface-2);border-color:var(--line)}
.chTx .hsStat b.on{background:#ffd21f;border-color:#111}
/* продолжить игру и код сохранения */
.mbCont{background:linear-gradient(180deg,#8be38f,#3fbf5a);margin-bottom:10px}
.saveTa{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);resize:vertical;margin:6px 0 10px;word-break:break-all}
/* две кнопки «Продолжить» и прогресс */
.mbConts{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
@media (min-width:760px){.mbConts:has(> :nth-child(2)){grid-template-columns:1fr 1fr}}
.mbConts .mbCont{margin:0}
.mbCont-eric{background:linear-gradient(180deg,#ffb36b,#e9771f)}
.mbRank{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%;padding:8px;border-radius:10px;color:#aebbe8;font-size:12px;font-weight:700}
.mbRank:hover,.mbRank:focus-visible{background:rgba(255,255,255,.08)}
.mbProg{color:#fff;text-decoration:underline;margin-left:6px}
.prCard h2{margin-bottom:10px}
.prGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
@media (min-width:760px){.prGrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.prCell{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.prCell b{font-family:var(--display);font-size:18px}
.prCell span{font-size:12px;color:var(--muted)}
.mbFeedback{display:block;text-align:center;margin:10px auto 0;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.25)}
.mbFeedback:hover,.mbFeedback:focus-visible{background:rgba(255,255,255,.2)}

/* уровень сложности салона */
.seg .diff{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;line-height:1;padding:3px 8px;border-radius:999px;margin:2px 0 1px;letter-spacing:.02em}
.seg .diff.d-easy{background:#d9f2df;color:#1d6b33}
.seg .diff.d-mid{background:#fdecc8;color:#8a5a00}
.seg .diff.d-hard{background:#fadada;color:#9b2020}

/* «На экран Домой» */
.a2hs{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,16,12,.55);overflow:auto}
.a2hsCard{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.a2hsTop{display:flex;gap:12px;align-items:flex-start}
.a2hsAya{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent)}
.a2hsT b{font-family:var(--display);font-weight:500;font-size:14px;color:#7a5fd6}
.a2hsT p{margin:2px 0 0;font-size:15px}
.a2hsPrev{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.a2hsIcon{width:60px;height:60px;border-radius:14px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.a2hsTabs{display:flex;gap:6px;flex-wrap:wrap}
.a2hsTab{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.a2hsTab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.a2hsTab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.a2hsSteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.a2hs .btnrow{flex-wrap:wrap;justify-content:flex-end}

/* ---------- режим директора ---------- */
body.dirMode .hud .plate{display:none}
.hsDir{display:grid;gap:8px;margin-top:6px}
.hsDirT{font-family:var(--display);font-weight:700;font-size:16px;color:#fff;text-align:center;text-transform:uppercase;letter-spacing:.08em}
.hsDirCard{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.hsDirCard img{width:64px;height:64px;object-fit:cover;object-position:top;border-radius:50%;background:var(--surface-2);flex:none}
.hsDirTx{display:grid;gap:2px;flex:1 1 220px;min-width:0;font-size:14px}
.hsDirTx span{color:var(--muted)}
.hsDirBtns{display:flex;flex-wrap:wrap;gap:8px}
.hsDirPlay{font-size:15px;padding:10px 18px}
.hsDirPlay.alt{background:var(--surface-2);color:var(--ink)}
.dirStatWrap{display:grid;gap:6px}
.dirStat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:520px){.dirStat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dirKpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;gap:1px}
.dirKpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dirKpi b{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirKpi.neg b{color:var(--bad)} .dirKpi.pos b{color:var(--leaf)}
.dirMasters{display:flex;flex-wrap:wrap;gap:6px}
.dirM{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--surface-2)}
.dirM.low{background:var(--bad-soft);color:var(--bad)}
.dirLevers{display:grid;gap:10px}
.dirSeg{display:grid;gap:4px}
.dirSegL{font-size:13px;color:var(--muted)}
.dirSegR{display:flex;flex-wrap:wrap;gap:6px}
.dirSegR button{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.dirSegR button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dirSegR button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dirForms{display:grid;gap:8px}
.dirForm{text-align:left}
.dirTblW{overflow-x:auto;flex:none}
.dirStatWrap,.dirLevers,.dirForms,.hsDir{flex:none}
.dirTbl{border-collapse:collapse;width:100%;font-size:14px}
.dirTbl td{padding:5px 8px;border-bottom:1px solid var(--line)}
.dirTbl td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dirTbl td.neg{color:var(--bad)}
.dirTbl tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.dirStars{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:4px}
.dirStars li{color:var(--muted)} .dirStars li.on b{color:var(--leaf)}
.dirDisc{font-size:12px;color:var(--muted);margin:0}

<body>
<div class="wrap">
  <header class="hud" aria-label="Состояние игры">
    <div class="plate pMood" title="Настроение клиента: от −100 до +100"><span class="ico" id="moodIco" aria-hidden="true">😐</span><div class="pIn"><span class="pLbl">Настроение</span><div class="bar thermo" aria-hidden="true"><s></s><i id="credBar"></i></div></div><b id="credOut">0</b></div>
    <div class="plate pPts" title="Баллы мастерства"><span class="ico" aria-hidden="true">★</span><b id="hudPts">0</b></div>
    <div class="plate pMoney" title="Заработано за смену"><span class="ico" aria-hidden="true">₽</span><b id="hudMoney">0 ₽</b></div>

  coatOn = false; pose('marina','dress');
  await kiraStand();
  await Promise.all([walk('marina', P.chairStand[0], P.chairStand[1], {cam:narrow()}), walk('kira', P.chairK[0], P.chairK[1])]);
  pose('marina','sit'); face('marina',1); setPos('marina', P.chairSit[0], P.chairSit[1]); face('kira',1);
  await camTo(1080);
}
async function toReception(){
  await marinaStand();
  await Promise.all([walk('marina', P.rec[0], P.rec[1], {face:-1}), walk('kira', P.kiraRec[0], P.kiraRec[1], {face:-1})]);
  await camTo(560);
}
function slide(id, x, ms){        // движение без смены позы (подметает на месте)
  const c = C[id], fx = c.x;
  return new Promise(res => {
    if (reduce){ c.x = x; place(id); return res(); }
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
      c.x = fx + (x - fx) * e; place(id); if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
}
async function sweep(){
  await walk('kira', P.sweep[0], P.sweep[1], {cam:narrow()});
  C.kira.el.parentNode.append(C.kira.el);            // Кира с метлой — на переднем плане, перед клиенткой в кресле
  pose('kira','sweep'); cls('kira','busy',true);
  const cl = document.getElementById('clips'), x0 = C.kira.x;
  const passes = [-70, 60, -40, 30, 0];
  for (let i = 0; i < passes.length; i++){
    await slide('kira', x0 + passes[i], 650);
    cl.style.opacity = Math.max(0, 1 - (i + 1) / (passes.length - 1));
    await wait(250);
  }
  clips(false); cls('kira','busy',false); pose('kira','stand');
}

function rollOutcome(){
  const q = sumPts() + S.trust - S.mistakes;
  const pSat = clamp(0.3 + 0.045*q - 0.12*S.risk, 0.1, 0.85);
  const pUnh = clamp(0.22 - 0.025*q + 0.12*S.risk, 0.05, 0.6);
  const r = Math.random();
  S.outcome = r < pSat ? 'sat' : (r < pSat + pUnh ? 'unh' : 'neu');
  return S.outcome === 'sat' ? 's7sat' : S.outcome === 'unh' ? 's7unh' : 's7neu';
}
function earnings(){
  const rows = [];
  if (S.done && S.service && S.end !== 'ref' && S.end !== 'left' && S.end !== 'fail'){
    const p = PRICE[S.service];
    rows.push([(S.service === 'cut' ? 'Стрижка + укладка ' : 'Укладка ') + rub(p) + ', 50% мастеру', p/2]);
    if (S.wash) rows.push(['Мытьё ' + rub(PRICE.wash) + ', 50% мастеру', PRICE.wash/2]);
    if (S.retail) rows.push(['Средство для укладки ' + rub(PRICE.retail) + ', 10% мастеру', PRICE.retail*0.1]);
    if (S.meter >= 40) rows.push(['Чаевые', 100]);
  }
  return {rows, total: rows.reduce((a,r)=>a+r[1],0)};
}
function hud(){
  const v = clamp(S.meter, -100, 100), bar = document.getElementById('credBar');
  bar.style.left = (v >= 0 ? 50 : 50 + v/2) + '%'; bar.style.width = Math.abs(v)/2 + '%';
  bar.className = v >= 0 ? 'pos' : (v <= -50 ? 'neg low' : 'neg');
  document.getElementById('credOut').textContent = (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
  document.getElementById('hudPts').textContent = sumPts()*2 + (S.xPts || 0);
  document.getElementById('hudMoney').textContent = rub(earnings().total + (S.xMoney || 0)).replace(' ₽','');
  document.getElementById('moodIco').textContent = v >= 40 ? '😀' : v >= 10 ? '🙂' : v > -10 ? '😐' : v > -50 ? '😟' : '😡';
  const rk = getRank(), rp = document.getElementById('rankPlate');
  document.getElementById('hudRank').textContent = rk ? RANKS[rk].replace(' ножницы','') : 'Нет';
  rp.className = 'plate pRank r' + rk; rp.title = 'Ранг ножниц: ' + RANKS[rk];
}
function apply(o){
  if (o.d){ S.meter += o.d; S.mistakes++; }
  if (o.m) S.meter += o.m;
  S.meter = clamp(S.meter, -100, 100);
  (o.pts || []).forEach(k => S.pts[k] += 1);
  if (o.trust) S.trust += o.trust;
  if (o.risk) S.risk += o.risk;
  if (o.set) Object.assign(S, o.set);
  if (o.mood) S.mood = o.mood;
}

let tRaf = 0, busy = false;
function startTimer(sec = TIMER_SEC, onTimeout = null){
  const wrap = el('div','timer'), fill = el('i'); wrap.append(fill);
  const list = panel.querySelector('.choices'); panel.insertBefore(wrap, list);
  const t0 = performance.now(); let fired = false, lastS = -1;
  tmr.className = 'tmr on';
  const tick = now => {
    const k = (now - t0) / (sec*1000), left = Math.max(0, Math.ceil(sec * (1 - k)));
    fill.style.transform = 'scaleX(' + Math.max(0, 1-k) + ')';
    if (left !== lastS){
      lastS = left; tmr.textContent = '⏱ ' + left;
      const low = left <= Math.min(10, Math.round(sec/3)); tmr.classList.toggle('low', low); wrap.classList.toggle('low', low);
    }
    if (k >= 1 && !fired && onTimeout){ fired = true; onTimeout(wrap); }
    if (k >= 1 && !fired){
      fired = true; S.meter = clamp(S.meter - 5, -100, 100); S.mistakes++; hud();
      S.log.push({title:curTitle, picked:'Слишком долгая пауза с ответом', ok:false, d:-5, cats:['Vn'], aya:'Клиент ждёт реакции сразу. Пауза выглядит как безразличие.', best:null});
      panel.insertBefore(el('div','toast','Затянутая пауза: настроение −5.'), wrap);
      if (C.marina.vis){ mood('marina','doubt'); showBust(null); showDlg('marina', 'Эм… Вы меня слышите?'); }
      if (S.meter <= LEAVE){ cancelAnimationFrame(tRaf); return fail(); }
    }
    tRaf = requestAnimationFrame(tick);
  };
  tRaf = requestAnimationFrame(tick);
}
const stopTimer = () => { cancelAnimationFrame(tRaf); tmr.className = 'tmr'; };

function logPick(node, c, t){
  const good = node.choices.filter(x => !x.d && x.pts && x.pts.length).sort((a,b) => b.pts.length - a.pts.length)[0];

    aya:c.aya || '', best:(c.d && good) ? txt(good) : null});
}

async function drillAsk(R, line, choices, step, narr){
  const id = R.id;
  panel.innerHTML = ''; panel.append(drillHead(R.title, DR.i + 1));
  say(id, line, {hold:true, narr:!!narr});
  const list = el('div','choices'); list.setAttribute('role','group'); list.setAttribute('aria-label','Варианты ответа');
  shuffle(choices).forEach(c => {
    const b = el('button','choice'); b.type = 'button';
    b.innerHTML = '<span class="k" aria-hidden="true"></span><span></span>'; b.lastChild.textContent = c.t;
    b.onclick = () => drillPick(R, c, choices, b, list, step);
    list.append(b);
  });
  panel.append(list);
  let late = false;
  startTimer(DRILL_SEC, wrap => {
    late = true; S.meter = clamp(S.meter - 5, -100, 100); hud(); mood(id,'doubt');
    DR.log.push({title:NAMES[id] + ' · ' + R.title, picked:'Слишком долгая пауза с ответом', ok:false, d:-5, aya:'Приветствие выдают сразу. Пауза выглядит как безразличие.', best:null});
    panel.insertBefore(el('div','toast','Пауза затянулась: настроение −5.'), wrap);
    showBust(null); showDlg(id, '…');
  });
  fitStage();
}
async function drillPick(R, c, choices, btn, list, step){
  if (busy) return; busy = true;
  stopTimer(); clearHeld();
  [...list.children].forEach(x => x.disabled = true); btn.classList.add('picked');
  const tm = panel.querySelector('.timer'); if (tm) tm.remove();
  S.meter = clamp(S.meter + c.m, -100, 100); if (c.ok) S.xPts = (S.xPts || 0) + 2; hud();
  const best = choices.find(x => x.ok);
  DR.log.push({title:NAMES[R.id] + ' · ' + R.title, picked:c.t, ok:!!c.ok, d:c.ok ? 0 : c.m, m:c.ok ? c.m : 0, aya:c.aya, best:c.ok ? null : best.t});
  mood('kira', c.ok ? 'smile' : 'doubt');
  if (/^Выйти навстречу/.test(c.t)){ await camWide(); await walk('kira', C[R.id].x + 170, P.kiraRec[1], {face:-1, cam:narrow()}); }
  const quotes = c.t.match(/«[^»]*»/g) || [];
  if (quotes.length) for (const q of quotes) await say('kira', q.slice(1, -1));
  else await say('kira', c.t, {narr:true});
  mood(R.id, moodFor(S.meter));
  const fb = el('div','chips');
  fb.append(el('span', 'chip ' + (c.m >= 0 ? 'plus' : 'minus'), 'Настроение ' + (c.m >= 0 ? '+' + c.m : String(c.m).replace('-','−'))));
  panel.append(fb);
  ayaTail(c.aya, c.ok ? 'praise' : 'warn');
  const h = el('div','hint','<b>Айя:</b>&nbsp;'); h.append(document.createTextNode(c.aya)); panel.append(h);
  if (!c.ok){ const best = choices.find(x => x.ok); const b = el('div','hint best','<b>Лучше:</b>&nbsp;'); b.append(document.createTextNode(best.t)); panel.append(b); }
  busy = false;
  const nx = el('button','next', step === 1 ? 'Дальше' : (DR.i + 1 < DRILL.length ? 'Следующий клиент' : 'Итог тренажёра')); nx.type = 'button';
  nx.onclick = async () => {
    nx.disabled = true;
    if (step === 1){
      if (Math.abs(C.kira.x - P.kiraRec[0]) > 40){ hideDlg(); await camWide(); await walk('kira', P.kiraRec[0], P.kiraRec[1], {face:-1, cam:narrow()}); }
      return drillAsk(R, R.line2 || R.line2narr, R.c2, 2, !R.line2);
    }
    await drillFinishRound(R);
  };
  panel.append(nx); fitStage(); nx.focus({preventScroll:true});
}
async function drillFinishRound(R){
  const v = S.meter, id = R.id;
  if (v >= 20) DR.happy++;
  const res = v >= 20 ? NAMES[id] + ' довольна визитом.' : v >= 0 ? NAMES[id] + ' спокойна, но без восторга.' : NAMES[id] + ' недовольна приёмом.';
  const resM = id === 'andrey' ? res.replace('довольна','доволен').replace('спокойна','спокоен').replace('недовольна','недоволен') : res;
  mood(id, moodFor(v));
  await say('kira', resM + ' Настроение: ' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + '.', {narr:true});
  await camWide();
  await walk(id, 1150, 668, {cam:narrow()}); vis(id, false);
  DR.i++;
  if (DR.i < DRILL.length) return drillRound();
  drillSummary();
}
async function drillSummary(){

  PARTNER = 'marina'; hideDlg(); bust.className = 'bust';

  const okN = DR.log.filter(r => r.ok).length, all = DR.log.filter(r => r.title).length;

  c0.innerHTML = '<h2>Результат</h2><p>Довольных клиентов: <b>' + DR.happy + ' из ' + DRILL.length + '</b>. Лучших ответов: <b>' + okN + ' из ' + picks + '</b> (' + Math.round(okN / Math.max(1, picks) * 100) + '%).</p>';
  const c1 = el('div','card'); c1.append(el('h2', null, 'Работа над ошибками'));
  const ul = el('ul','review');
  DR.log.forEach(r => {
    const li = el('li', r.ok ? 'ok' : 'bad');
    const h = el('div','rt'); h.textContent = (r.ok ? '✓ ' : '✗ ') + r.title + (r.d ? ' · настроение ' + String(r.d).replace('-','−') : ''); li.append(h);

    ul.append(li);
  });
  c1.append(ul);
  panel.append(c0, c1);
  setPos('kira', P.kiraRec[0], P.kiraRec[1]); face('kira', -1); mood('kira', DR.happy >= 4 ? 'happy' : 'smile');
  await kiraFinale(DR.happy >= 4 ? 'happy' : 'smile');
  ayaState(DR.happy >= 4 ? 'praise' : 'cheer');
  await say('aya', DR.happy === DRILL.length ? 'Все пять клиентов довольны. Вы говорите с каждым на его языке.' : 'Посмотрите, где я подсказывала, и пройдите тренажёр ещё раз.');
  const again = el('button','next','Ещё раз'); again.type = 'button'; again.onclick = () => drillStart();
  const menu = el('button','next alt','В меню'); menu.type = 'button'; menu.onclick = () => restart(false);
  const row = el('div','btnrow'); row.append(menu, again); panel.append(row);
}

постричь без сделки, а то вдруг я в пай зайду только фейдами. Волосы у тебя тонкие и осветлённые — аккуратнее с длиной"}, {"who": "client", "note": "", "t": "Вот! Укладка к вечеру разваливается. На утренних встречах я бог, на вечерних — одуванчик"}], "fin": [{"who": "narr", "t": "Марк поправляет манжету и усмехается."}, {"who": "client", "t": "Ладно, бро, ты меня переиграл. Глину беру. И визитку дай — приведу партнёров"}, {"who": "eric", "t": "Приводи. Им тоже без скидки"}], "ayaFin": "Договорщику не сдают цену — ему показывают ценность. Один точный совет продаёт лучше десяти баночек", "w": 254, "h": 760, "d1": {"title": "просьба о скидке", "opts": [{"ok": true, "t": "«Хай! Я Эрик. Миллионера — за сорок минут, по прайсу. Скидки не дам, зато вид будет такой, что скидку дадут тебе. Как зовут?»", "pts": 12, "aya": "Цена остаётся, а шутка переводит разговор на ценность. Переговорщик оценит ход."}, {"ok": false, "t": "«Хай! Я Эрик. Полгорода — это сильно, ценю. Ну давай десять процентов… только как новому клиенту, тихонько, чтобы Гриша не узнал»", "pts": -4, "aya": "Уступка с порога дешевит работу. В следующий раз он попросит двадцать."}, {"ok": false, "t": "«Скидок нет. Садись. Приводи хоть полгорода — прайс один для всех, мне без разницы»", "pts": -8, "aya": "Правда, но холодно. Контактный клиент ждёт контакта в ответ."}]}, "d2": {"title": "продажа ухода", "intro": "Клиент сам назвал проблему. На полке — матовая глина и спрей для объёма.", "opts": [{"ok": true, "t": "«Держи сделку: спрей на корни, потом глина с горошину. Одуванчик отменяется. Сделаю прямо сейчас — проверишь на переговорах»", "pts": 12, "aya": "Продажа через демонстрацию и на его языке — «сделка». Клиент видит результат на себе."}, {"ok": false, "t": "«Для твоей укладки нужен комплект. Бери всё: глину, спрей, шампунь и масло для бороды — с набором точно не прогадаешь»", "pts": -7, "aya": "Бороды у него нет. Впаривание договорщик чувствует лучше всех."}, {"ok": false, "t": "Ничего не предлагать, просто красиво уложить — вдруг опять попросит скидку, а настроение перед переговорами портить не хочется", "pts": -5, "aya": "Клиент сам пожаловался. Молчание — упущенная забота и упущенная продажа."}]}}, {"salon": "pijon", "master": "eric", "name": "Денис", "age": 24, "title": "предел барбера", "img": "denis", "enter": "16:30. Рыжие кудри, сливовая рубашка. Денис заходит с улыбкой и сразу нюхает банки на полке.", "line": "Ой, как у вас атмосферно! Кирпич, лампочки… Слушайте, я хочу отрастить кудри до плеч. Надо как-то правильно подрезать, чтобы не было треугольника", "lineNote": "", "chair": [{"who": "client", "note": "", "t": "Денис. У меня выставка через месяц, хочу образ как у художников Возрождения!"}, {"who": "eric", "note": "", "t": "Мой образ Возрождения — это когда после курсов заказал новую машинку"}, {"who": "narr", "t": "Эрик про себя: кудри, длина, расчёт под форму… Этого на курсах не было."}, {"who": "client", "note": "смеётся", "t": "Ты ведь справишься? Я тебе доверяю!"}], "fin": [{"who": "narr", "t": "Денис на секунду стихает, потом улыбается."}, {"who": "client", "t": "Знаешь, это даже приятно. Мне обычно обещают всё, а потом… Давай окантовку — и скинь имя того мастера"}, {"who": "narr", "t": "Эрик чешет затылок."}, {"who": "eric", "t": "Второй раз за неделю… Кажется, машинка — это ещё не вся профессия"}], "ayaFin": "Честное «не мой профиль» сохраняет клиента лучше испорченной стрижки. А удлинённые мужские стрижки даст повышение квалификации", "w": 350, "h": 760, "d1": {"title": "приветствие", "opts": [{"ok": true, "t": "«Хай! Атмосфера — это наше всё, стрижки так, приложение. Я Эрик. А ты? Покажи, как кудри лежат сейчас»", "pts": 10, "aya": "Тепло в ответ на тепло, шутка про себя и сразу внимание к его волосам."}, {"ok": false, "t": "«Хай! Я Эрик. Кудри? Да давай фейд запилим, сейчас все так ходят — и никаких треугольников, и никакой укладки»", "pts": -6, "aya": "Вы навязываете своё и обесцениваете его идею. Для чувствительного клиента это отвержение."}, {"ok": false, "t": "«Хай! Атмосфера — да, у нас уютно. Садись, разберёмся по ходу, что с кудрями»", "pts": -4, "aya": "Нейтрально, но без имени и без контакта — а ему важнее всего отклик."}]}, "d2": {"title": "честность про границы", "intro": "", "opts": [{"ok": true, "t": "«Ден, скажу честно: удлинённые стрижки на кудрях — не мой профиль. Сегодня сделаю окантовку на шее, а форму под длину посоветую у мастера-парикмахера. Хочу, чтобы на выставке смотрели на картины, а не на твой треугольник»", "pts": 12, "aya": "Эталон Академии: честно про границы и совет коллеги. И с юмором — отказ не звучит как отвержение."}, {"ok": false, "t": "«Конечно, бро! Треугольник — это просто слои не сняли. Дела на пять минут: подрежу по контуру, сниму вес изнутри, и будут лежать как надо» — и взяться за ножницы", "pts": -8, "aya": "Кудри после стрижки сокращаются. Без расчёта формы будет тот самый «треугольник»."}, {"ok": false, "t": "«Ден, скажу как барбер: длинные кудри — вчерашний день. Может, всё-таки коротко? Сделаю текстурный кроп с фейдом — кудри сверху останутся, а мороки никакой»", "pts": -4, "aya": "Отговаривать от мечты, потому что сам не умеешь, — нечестно."}]}}, {"salon": "pijon", "master": "eric", "name": "Алексей", "age": 30, "title": "Что мы знаем точно?", "img": "aleksey", "enter": "10:00. Стройный блондин в бежевом бомбере осторожно смотрит на барберский столб и на татуировки Эрика. Достаёт телефон с фото.", "line": "Добрый день. Вот фото моей стрижки на третий день. Нужно именно так. В прошлый раз виски были на полсантиметра короче, чем надо", "lineNote": "", "chair": [{"who": "client", "note": "", "t": "Алексей. Я аналитик, привык к точности. Извините, если дотошный"}, {"who": "eric", "note": "", "t": "Дотошный клиент — мечта барбера. Худшее — когда говорят «ну, как-нибудь», а потом оказывается не как-нибудь"}, {"who": "client", "note": "мягко улыбается", "t": "Интересное наблюдение. Так на сколько короче сегодня?"}], "fin": [{"who": "narr", "t": "Алексей сравнивает с фото, делает паузу."}, {"who": "client", "t": "Точно. Знаете, я думал, что барбершоп — это про бороды и рок. А тут линейка"}, {"who": "eric", "t": "Рок — по пятницам. Записать через четыре недели?"}], "ayaFin": "Не каждый мужчина в барбершопе ждёт «бро». Точному клиенту — цифры, план и немного лёгкой иронии в свой адрес", "w": 296, "h": 760, "d1": {"title": "точный клиент в мужском зале", "opts": [{"ok": true, "t": "«Добрый день! Я Эрик, барбер. Не пугайтесь татуировок, линейкой я пользуюсь точнее, чем рисую. Как к вам обращаться? И давайте фото разберём»", "pts": 12, "aya": "Самоирония снимает его настороженность, а «вы» и работа с его фото показывают: его услышали."}, {"ok": false, "t": "«Хай, бро! Я Эрик. Фото вижу, всё понятно. Да не парься ты с фотками, сделаю кайфово — по вискам будет как надо»", "pts": -7, "aya": "Для аналитика «не парься» значит «тебя не слушают». Неформал с порога ему чужд."}, {"ok": false, "t": "«Добрый день. Понял: виски на полсантиметра длиннее, верх как на фото» — и сразу за машинку", "pts": -5, "aya": "Нет имени и нет проверки понимания. Потом спор будет слово против слова."}]}, "d2": {"title": "консультация фактами", "intro": "", "opts": [{"ok": true, "t": "«Волосы растут примерно на сантиметр в месяц. Виски — насадка на полсантиметра длиннее прошлой, сверху почти не снимаю длину. Покажу в зеркале до того, как резать. Принимается?»", "pts": 12, "aya": "Цифры, насадка и проверка перед действием. Для аналитика это и есть доверие."}, {"ok": false, "t": "«Всё понял: виски длиннее на полсантиметра, сверху почти не трогаем. Рука набита — таких стрижек за год сотни. Будет как на фото»", "pts": -7, "aya": "«Рука набита» — не довод для точного клиента. Ему нужны цифры: насадка, сантиметры и проверка в зеркале."}, {"ok": false, "t": "«Слушайте, раз виски всё время не те — а давайте лучше скин-фейд! Вообще другой человек будете, и никаких полсантиметра считать не придётся»", "pts": -5, "aya": "Он пришёл за предсказуемость, а не за новой личностью. Новое предлагают в конце и как вариант."}]}}, {"salon": "pijon", "master": "eric", "name": "Вадим", "age": 55, "title": "Не торопись", "img": "vadim", "enter": "17:20. Худощавый мужчина в сером пальто, волосы с сединой. В зале играет рок, соседний барбер громко обсуждает матч. Вадим молча вешает пальто.", "line": "Добрый вечер. Как обычно", "lineNote": "тихо, после паузы", "chair": [{"who": "client", "note": "", "t": "Вадим. Коротко, аккуратно, виски прямые"}, {"who": "narr", "t": "Дальше молчит и смотрит в зеркало."}, {"who": "narr", "t": "Эрик не заполняет паузу и работает. Через десять минут Вадим сам нарушает тишину."}, {"who": "client", "note": "", "t": "Дочь сказала, что седина меня старит. У вас тут все молодые… Думаете, стоит что-то делать?"}], "fin": [{"who": "narr", "t": "Вадим долго смотрит в зеркало и едва заметно улыбается."}, {"who": "client", "t": "Спасибо, что не торопили. И за музыку. Подумаю про камуфляж"}], "ayaFin": "В шумном барбершопе тихий клиент ценит покой больше шуток. А о седине говорят как о выборе, а не как о недостатке", "w": 393, "h": 760, "d1": {"title": "тихий клиент в шумном зале", "opts": [{"ok": true, "t": "«Добрый вечер. Я Эрик. Как к вам обращаться? И покажите, что значит «как обычно». Музыку сделаю потише»", "pts": 12, "aya": "Спокойно, без суеты, и забота о тишине без лишних слов. «Как обычно» у нового мастера уточняют."}, {"ok": false, "t": "«Добрый вечер! Чё как, бро? Слышал, как вчера наши слили? Это же вообще! Садись, расскажу, что там было»", "pts": -7, "aya": "Для сдержанного человека после пятидесяти «бро» и футбол с порога — шум. Он замкнётся."}, {"ok": false, "t": "«Добрый вечер. Ок, как обычно — понял, садитесь» — и стричь на своё усмотрение", "pts": -5, "aya": "Вы видите его впервые. Угадать «как обычно» нельзя."}]}, "d2": {"title": "деликатный вопрос", "intro": "", "opts": [{"ok": true, "t": "«Седина вам идёт — ровная, благородная. Я бы сам такую хотел, да мне до неё ещё лет двадцать. Если захотите — есть камуфляж седины: она станет мягче, но не исчезнет. Решать вам, и не сегодня обязательно»", "pts": 12, "aya": "Честно, бережно, с выбором и лёгкой самоиронией. Комплимент звучит искренне, а не как продажа."}, {"ok": false, "t": "«Да конечно! Седина старит, это все знают. Закрасим — и лет на десять моложе, будете как мы. Есть отличный камуфляж: двадцать минут — и дочки не узнают»", "pts": -7, "aya": "Вы подтвердили, что он выглядит старо, и торопите. Для него это давление."}, {"ok": false, "t": "«Слушайте, седина — это нормально, её не надо стесняться. Да забейте, дочки всегда придираются, у меня сестра такая же. Сделаем как обычно»", "pts": -5, "aya": "Оценивать его семью нельзя. И он спрашивал не о дочери, а о себе."}]}}, {"salon": "pijon", "master": "eric", "name": "Михаил", "age": 48, "title": "борода, сила Эрика", "img": "mikhail", "enter": "12:40. Коренастый мужчина в оливковой рубашке, рукава закатаны, на пальцах следы мазута. Густая борода с сединой. Первым делом замечает шатающийся подлокотник кресла.", "line": "Здравствуй. Подстричься и бороду в порядок. А у вас тут винт разболтался, могу подтянуть", "lineNote": "", "chair": [{"who": "client", "note": "", "t": "Михаил. Бороду покороче и чтобы форма была, а то жена говорит — как лесник. Вот с такой окантовкой, как у вас на плакате"}, {"who": "eric", "note": "", "t": "Сделаем. Борода — это моё, тут я уверен. А вы чем занимаетесь? Руки рабочие"}, {"who": "client", "note": "улыбка появляется постепенно", "t": "Автосервис свой. Сейчас через одного китайцы. Да и сам на «Хавейле» езжу — честная машина"}, {"who": "eric", "note": "", "t": "Зачётная тачка! А я пока на самокате — зато парковка всегда бесплатная"}], "fin": [{"who": "narr", "t": "Михаил трогает бороду, смотрит в зеркало."}, {"who": "client", "t": "Вот теперь собрано точно по чертежу"}, {"who": "narr", "t": "По пути к выходу всё-таки подтягивает винт на подлокотнике."}, {"who": "eric", "t": "Михаил, с вас скидка на ремонт — шучу, скидок не дают никому, но спасибо от души"}], "ayaFin": "То, что для Киры предел, для Эрика — сила. А уход продаётся одним точным средством под проблему клиента", "w": 404, "h": 760, "d1": {"title": "забота делом", "opts": [{"ok": true, "t": "«Здравствуйте! Я Эрик. Вот спасибо — я неделю на него смотрю и делаю вид, что так задумано. Как к вам обращаться?»", "pts": 10, "aya": "Самоирония плюс благодарность. Практичный человек проявил заботу делом — заметьте это."}, {"ok": false, "t": "«Здорово! Я Эрик. Да ладно, батя, садись, не заморачивайся — винт подождёт, у нас тут всё держится на честном слове»", "pts": -6, "aya": "Он предложил помощь — а его отмахнули и назвали «батей». Двойное обесценивание."}, {"ok": false, "t": "«Здравствуйте, я Эрик. Спасибо, но не трогайте, у нас мастер есть. Садитесь, начнём»", "pts": -4, "aya": "Вежливо, но помощь отвергнута. Для мастера на все руки это холодно."}]}, "d2": {"title": "уход за бородой", "intro": "Борода сделана, Михаил доволен, но чешет щеку: «Чешется вечно. Да ладно, перетерплю».", "opts": [{"ok": true, "t": "«Не надо терпеть. Кожа под бородой сохнет — как механизм без смазки. Две-три капли масла вечером — и тишина. Попробуйте прямо сейчас»", "pts": 12, "aya": "Объяснение на его языке и проба на месте. Так уход продаётся без давления."}, {"ok": false, "t": "«Чешется — значит, нужен уход. Берите масло, бальзам, шампунь для бороды и расчёску — комплектом выгоднее, и всё сразу решится, гарантирую на сто процентов»", "pts": -7, "aya": "Практичный человек берёт одно нужное, а не корзину. Комплект звучит как развод."}, {"ok": false, "t": "«Это нормально, у всех так первые месяцы. Да, борода всегда чешется, привыкнете — потом кожа сама перестанет реагировать»", "pts": -5, "aya": "Клиент сам назвал проблему. У барбера есть решение — молчать о нём нельзя."}]}}, {"salon": "pijon", "master": "eric", "name": "Роман", "age": 38, "title": "Здесь уже дышать нечем", "img": "roman", "enter": "19:05. У Эрика затянулся предыдущий клиент с бородой. Роман — загорелый, в белой льняной рубашке — ждёт пятнадцать минут и нарезает круги между диваном и дверью.", "line": "Слушай, я записан на семь! Завтра в шесть самолёт, а я тут стою как дурак!", "lineNote": "громко, всплескивая руками", "chair": [{"who": "client", "note": "уже теплее", "t": "Роман. Извини, перегнул. День сумасшедший. Лечу на море, там байк возьму — и вдоль побережья!"}, {"who": "eric", "note": "", "t": "Вот это план. Я бы тоже укатил, но меня тут бороды держат в заложниках"}, {"who": "client", "note": "смеётся, потом вдруг проводит ладонью по волосам", "t": "А знаешь что? Давай под ноль! Шлем всё равно. Режь всё!"}], "fin": [{"who": "narr", "t": "Роман смеётся и трясёт головой."}, {"who": "client", "t": "Слушай, ты прав. Я бы в самолёте уже пожалел. Вернусь — сразу к тебе, фотки с байка покажу!"}], "ayaFin": "Вспышку гасят признанием и действием, а импульсивное «режь всё» — повод на секунду остановиться. В мужском зале помогает и шутка", "w": 372, "h": 760, "d1": {"title": "вспышка из-за ожидания", "opts": [{"ok": true, "t": "«Ты прав, извини — борода перед тобой оказалась с характером. Я Эрик. Падай — и за сорок минут соберём тебя в отпуск. Как зовут?»", "pts": 12, "aya": "Признать, извиниться, пошутить и сразу дать действие. На «ты» — потому что он сам так начал, но без «бро»: «бро» — для молодых."}, {"ok": false, "t": "«Расслабься, бро, не кипи. Не я же виноват, что клиент затянулся. Падай, сейчас быстро всё сделаем»", "pts": -7, "aya": "«Не кипи» и оправдание — бензин в огонь. Неформальный тон не спасает, если смысл обесценивает."}, {"ok": false, "t": "Ничего не объяснять, кивнуть и молча показать на кресло — быстрее начнём, быстрее закончим", "pts": -5, "aya": "Взрывному человеку нужен отклик. Молчание он прочитает как равнодушие."}]}, "d2": {"title": "импульсивное решение", "intro": "", "opts": [{"ok": true, "t": "«Могу, машинка заряжена. Но секунду: под ноль на южном солнце макушка сгорит в первый же день, и будешь красный, как твой байк. Предлагаю фейд по бокам и /* ================= СОХРАНЕНИЕ ПРОГРЕССА: только на устройстве игрока (localStorage) ================= */
const SAVE_KEY = 'romashka_save', DONE_KEY = 'romashka_done';
/* у каждого героя своё сохранение: Кира и Эрик продолжаются независимо */
(function(){ try { const old = localStorage.getItem(SAVE_KEY); if (old){ const o = JSON.parse(old); if (o && o.master) localStorage.setItem(SAVE_KEY + '_' + o.master, old); localStorage.removeItem(SAVE_KEY); } } catch(e){} })();
function saveGet(m){ try { const o = JSON.parse(localStorage.getItem(SAVE_KEY + '_' + m) || 'null'); return o && o.v === 1 ? o : null; } catch(e){ return null; } }
function savePut(o){ try { localStorage.setItem(SAVE_KEY + '_' + o.master, JSON.stringify(Object.assign({v:1, t:Date.now()}, o))); } catch(e){} }
function saveClear(m){ try { localStorage.removeItem(SAVE_KEY + '_' + m); } catch(e){} }
/* статистика по героям: смены, клиенты, довольные, лучшие ответы, заработок */
const STATS_KEY = 'romashka_stats';
function statsGet(){ try { return JSON.parse(localStorage.getItem(STATS_KEY) || '{}') || {}; } catch(e){ return {}; } }
function statsAdd(m, d){
  try {
    const all = statsGet(), s = all[m] || {shifts:0, visits:0, happy:0, best:0, answers:0, money:0, salons:{}};
    s.shifts += d.shifts || 0; s.visits += d.visits || 0; s.happy += d.happy || 0; s.best += d.best || 0; s.answers += d.answers || 0; s.money += d.money || 0;
    if (d.salon) s.salons[d.salon] = (s.salons[d.salon] || 0) + (d.shifts || 0);
    all[m] = s; localStorage.setItem(STATS_KEY, JSON.stringify(all));
  } catch(e){}
}
function doneGet(){ try { return JSON.parse(localStorage.getItem(DONE_KEY) || '{}') || {}; } catch(e){ return {}; } }
function doneMark(k){ try { const d = doneGet(); d[k] = (d[k] || 0) + 1; localStorage.setItem(DONE_KEY, JSON.stringify(d)); } catch(e){} }
function saveShift(){
  if (!MV) return;
  savePut({kind:'shift', master:MV.master, salon:MV.salon, cycle:MV.cycle || 1, i:MV.i, total:MV.list.length, xPts:S.xPts || 0, xMoney:S.xMoney || 0, money:MV.money, happy:MV.happy, career:MV.career});
}
const SALON_NAME = {romashka:'«Ромашка»', pijon:'«Пижон»', family:'«Семейная»'};
function saveLabel(o){
  const who = o.master === 'eric' ? 'Эрик' : 'Кира', noun = (o.salon === 'family' ? 'смена ' + (o.cycle || 1) + ' · ' : '') + (o.salon === 'romashka' ? 'клиентка' : 'клиент');
  const d = new Date(o.t), dd = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth() + 1).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return who + ' · ' + (SALON_NAME[o.salon] || o.salon) + ' · ' + noun + ' ' + (o.i + 1) + ' из ' + o.total + ' · сохранено ' + dd;
}
function saveResume(m){ const o = saveGet(m); if (!o || o.kind !== 'shift') return restart(false); track('save_resume'); menStart(o.master, o.career, o.salon, o); }
/* код сохранения: перенести прогресс на другое устройство без сервера */
const SAVE_KEYS = [SAVE_KEY + '_kira', SAVE_KEY + '_eric', DONE_KEY, STATS_KEY, 'romashka_rank', 'romashka_career', 'romashka_pijon', 'romashka_family', 'romashka_director', 'romashka_director_best'];
function saveCode(){
  const o = {}; SAVE_KEYS.forEach(k => { try { const v = localStorage.getItem(k); if (v !== null) o[k] = v; } catch(e){} });
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function saveLoadCode(code){
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!o || typeof o !== 'object') return false;
    let n = 0; Object.keys(o).forEach(k => { if (SAVE_KEYS.includes(k)){ localStorage.setItem(k, o[k]); n++; } });
    return n > 0;
  } catch(e){ return false; }
}

/* ---------- расчёт месяца ---------- */
function dirMonthCalc(){
  const i = D.month, k = 1 + DIR_SEAS[i];
  const priceK = 1 - (D.check - 650) / 50 * 0.08;
  const repK = 0.8 + D.rep / 250;
  const compK = D.compM > 0 ? 1 - D.comp : 1;
  const ev = D.ev || {};
  const cpd = Math.max(1, 3.5 * k * priceK * repK * compK * (ev.load || 1));
  const act = D.masters.filter(m => !m.gone);
  const r = {cpd, svc:0, rentIn:0, utilIn:0, care:0, pay:0, ins:0, mat:0, acq:0, careCost:0, fixed:0, extra:ev.cost || 0, interest:0, tax:0};
  const tamVis = D.tamDays * cpd;
  r.svc = tamVis * D.check; let visits = tamVis;
  r.mIncome = {};
  if (D.form === 'rent'){
    const chairs = Math.min(2, Math.ceil(act.length / 2));
    r.rentIn = chairs * 15000; r.utilIn = DIR_FIX.util * chairs / 3;
    act.forEach(m => { const v = 15 * cpd * (1 + m.base); r.mIncome[m.name] = v * D.check - 15000 / 2 - DIR_FIX.util / 6 - v * 40; });
  } else {
    act.forEach(m => {
      const v = 15 * cpd * (1 + m.base), rev = v * D.check, pct = m.pct || D.pct;
      let pay = rev * pct; r.mIncome[m.name] = pay;
      if (D.form === 'emp'){ pay = Math.max(pay, DIR_MROT); r.mIncome[m.name] = pay; pay *= 1.083; r.ins += pay * 0.302; }
      r.svc += rev; visits += v; r.pay += pay;
    });
  }
  if (D.care && D.mark){ r.care = 6000 * k * (D.rep / 50); r.careCost = r.care / 1.5 + (D.form === 'rent' ? 0 : r.care * 0.1) + 1500; }
  r.mat = visits * 40;
  r.acq = (r.svc + r.care) * 0.7 * 0.012;
  r.fixed = Object.values(DIR_FIX).reduce((a, b) => a + b, 0);
  r.interest = D.credit * 0.025;
  r.income = r.svc + r.rentIn + r.utilIn + r.care;
  r.exp = r.pay + r.ins + r.mat + r.acq + r.careCost + r.fixed + r.extra + r.interest;
  r.pre = r.income - r.exp;
  D.incQ += r.income; D.insQ += r.ins; D.incY += r.income;
  if (i % 3 === 2){
    const usn = D.incQ * 0.06, cap = D.form === 'emp' ? 0.5 : 1;
    const ipq = DIR_IPFIX / 4 + (i === 11 ? Math.max(0, D.incY - 300000) * 0.01 : 0);
    r.tax = Math.max(0, usn - Math.min(usn * cap, DIR_IPFIX / 4 + D.insQ)) + ipq;
    D.incQ = 0; D.insQ = 0;
  }
  r.net = r.pre - r.tax;
  return r;
}

function dirLoyalty(r){
  const low = [];
  D.masters.filter(m => !m.gone).forEach(m => {
    const inc = r.mIncome[m.name] || 0;
    let d = inc >= 20000 ? 5 : inc >= 15000 ? 1 : inc >= 12000 ? -4 : -8;   // мастера в экономе на 2/2 подрабатывают на дому: ориентир — 15–20 тыс. в салоне
    if (D.form === 'emp') d = Math.max(d, 4);
    if ((m.pct || D.pct) >= 0.5) d += 3; if ((m.pct || D.pct) <= 0.4) d -= 3;
    m.loy = Math.max(0, Math.min(100, m.loy + d));
    if (inc < DIR_MROT) low.push(m);
  });
  return low;
}

function dirPickEvent(){

    return {id:'fen2', text:'Фен Оли из ремонта снова сломался — в субботу утром.', opts:[dO(true,'Купить новый — 5 000 ₽.', 443, {cost:5000}), dO(false,'Пусть Оля работает своим.', 444, {loyName:'Оля', loy:-12})]}; }
  const fixed = DIR_EVENTS.find(e => e.month === D.month && !D.used.includes(e.id)); if (fixed) return fixed;
  const first = DIR_EVENTS.find(e => e.first && !D.used.includes(e.id) && (!e.when || e.when(D))); if (first) return first;
  const pool = DIR_EVENTS.filter(e => e.month == null && !e.first && !D.used.includes(e.id) && (!e.when || e.when(D)) && (!e.who || D.masters.some(m => m.name === e.who && !m.gone)));
  if (!pool.length || Math.random() < 0.15) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}
function dirApply(fx){
  D.ev = D.ev || {};
  if (fx.cost) D.ev.cost = (D.ev.cost || 0) + fx.cost;
  if (fx.load) D.ev.load = (D.ev.load || 1) * fx.load;
  if (fx.rep) D.rep = Math.max(0, Math.min(100, D.rep + fx.rep));
  if (fx.loy && !fx.loyName) D.masters.forEach(m => m.loy = Math.max(0, Math.min(100, m.loy + fx.loy)));
  if (fx.loyName){ const m = D.masters.find(x => x.name === fx.loyName); if (m) m.loy = Math.max(0, Math.min(100, m.loy + fx.loy)); }
  if (fx.pctName){ const m = D.masters.find(x => x.name === fx.pctName); if (m) m.pct = 0.5; }
  if (fx.later) D.flags[fx.later] = D.month + 2;
  if (fx.comp){ D.comp = fx.comp; D.compM = fx.compM; }
  if (fx.check) D.check = fx.check;
  if (fx.mark) D.mark = true;
  if (fx.care === false){ D.care = false; D.mark = false; }
  if (fx.premium) D.ev.cost = (D.ev.cost || 0) + fx.premium * D.masters.filter(m => !m.gone).length;
  if (fx.leave) dirLeave(fx.leave, fx.scandal);
}
function dirLeave(name, scandal){
  const m = D.masters.find(x => x.name === name && !x.gone); if (!m) return;
  m.gone = true; D.left++; D.rep = Math.max(0, D.rep - Math.round(m.base * 30)); if (scandal) D.scandal = true;
}
function dirDecide(title, sub, opts){
  return new Promise(res => {
    panel.innerHTML = ''; panel.append(dirHead(title));
    const s = el('p','menStep'); s.textContent = sub; panel.append(s);
    const list = el('div','choices'); list.setAttribute('role','group');
    shuffle(opts).forEach(c => {
      const b = el('button','choice'); b.type = 'button';
      b.innerHTML = '<span class="k" aria-hidden="true"></span><span></span>'; b.lastChild.textContent = c.t;
      b.onclick = () => {
        [...list.children].forEach(x => x.disabled = true); b.classList.add('picked'); clearHeld();
        D.log.push({m:D.month, ev:sub, picked:c.t, ok:!!c.ok, best:c.ok ? null : (opts.find(x => x.ok) || {}).t});
        if (c.aya){ const t = dirA(c.aya); ayaTail(t, c.ok ? 'praise' : 'warn'); const h = el('div','hint','<b>Айя:</b>&nbsp;'); h.append(document.createTextNode(t)); panel.append(h); }
        const best = opts.find(x => x.ok);
        if (!c.ok && best){ const bb = el('div','hint best','<b>Лучше:</b>&nbsp;'); bb.append(document.createTextNode(best.t)); panel.append(bb); }
        const nx = el('button','next','Дальше'); nx.type = 'button'; nx.onclick = () => { nx.disabled = true; stopVoice(); hideDlg(); res(c); };
        panel.append(nx); fitStage(); nx.focus({preventScroll:true});
      };
      list.append(b);
    });
    panel.append(list); fitStage();
  });
}

async function dirRun(){
  D._noHire = false;
  panel.innerHTML = ''; panel.append(dirHead('Месяц идёт'), el('p','wait','Мастера работают…'));
  C.tamara.pose = SP.tamara.cut ? 'cut' : 'stand'; place('tamara'); await wait(900);
  C.tamara.pose = SP.tamara.cash ? 'cash' : 'stand'; place('tamara'); await wait(500);
  const ev = dirPickEvent();
  if (ev){ D.used.push(ev.id); const c = await dirDecide('Событие месяца', ev.text, ev.opts); dirApply(c.fx); }
  const r = dirMonthCalc();
  const low = dirLoyalty(r);
  D.cash += r.net;
  if (D.compM > 0) D.compM--;
  r.month = D.month;
  D.months.push({m:D.month, income:Math.round(r.income), exp:Math.round(r.exp + r.tax), net:Math.round(r.net), cash:Math.round(D.cash)});
  // мастер с низкой верностью уходит
  const quit = D.masters.find(m => !m.gone && m.loy < 25);
  D.month++; dirPut();
  await dirReport(r, low, quit);
}
async function dirReport(r, low, quit){
  panel.innerHTML = ''; panel.append(dirHead('Отчёт месяца', DIR_MON[r.month] + ' · месяц ' + (r.month + 1) + ' из 12'), dirStatus());
  const t = el('table','dirTbl');
  const row = (n, v, c) => { const tr = el('tr', c || null); tr.append(el('td', null, n), el('td','num ' + (v < 0 ? 'neg' : ''), (v < 0 ? '−' : '') + rub(Math.round(Math.abs(v))))); t.append(tr); };
  row('Услуги (≈ ' + r.cpd.toLocaleString('ru-RU', {maximumFractionDigits:1}) + ' клиента на кресло в день)', r.svc);
  if (r.rentIn) row('Аренда кресел и коммуналка от мастеров', r.rentIn + r.utilIn);
  if (r.care) row('Продажи ухода', r.care);
  if (r.pay) row(D.form === 'emp' ? 'Зарплата мастерам с отпускными' : 'Мастерам, процент', -r.pay);
  if (r.ins) row('Страховые взносы за мастеров', -r.ins);
  row('Аренда и коммуналка', -(DIR_FIX.rent + DIR_FIX.util));
  row('Материалы, касса, хозтовары, бухгалтер и прочее', -(r.mat + r.acq + r.fixed - DIR_FIX.rent - DIR_FIX.util + r.careCost));
  if (r.extra) row('Расходы по событию месяца', -r.extra);
  if (r.interest) row('Проценты по кредиту', -r.interest);
  if (r.tax) row('Налог и взносы Тамары за квартал', -r.tax);
  row('Итог месяца', r.net, 'total');
  const tw = el('div','dirTblW'); tw.append(t);
  panel.append(tw);
  if (low.length) panel.append(el('p','note', 'Меньше МРОТ в этом месяце: ' + low.map(m => m.name).join(', ') + '.'));
  fitStage();
  ayaState(r.net >= 0 ? 'praise' : 'warn');
  if (r.tax) await say('aya', dirA(432));
  else await say('aya', dirA(r.net >= 0 ? 430 : 431));
  if (low.length && D.form === 'self' && !D.flags.lowSaid){ D.flags.lowSaid = 1; ayaState('warn'); await say('aya', dirA(437)); }
  if (quit){
    dirLeave(quit.name, false);
    C.tamara.pose = 'stand'; place('tamara');
    await say('tamara', quit.name + ' положила ключи на стойку: «Тамара Петровна, я ухожу. На мои деньги не прожить».', {narr:true});
    ayaState('warn'); await say('aya', dirA(439));
  }
  dirPut();
  if (D.cash < 0) return dirCredit();
  const nx = el('button','next', D.month >= 12 ? 'Итоги года' : 'Следующий месяц'); nx.type = 'button';
  nx.onclick = () => { nx.disabled = true; stopVoice(); hideDlg(); D.month >= 12 ? dirFinal() : dirPlan(); };
  panel.append(nx, el('p','dirDisc','Цифры и налоги — игровая механика. Для реальных решений сверяйтесь с актуальными данными Правительства РФ и бухгалтером.'));
  fitStage(); nx.focus({preventScroll:true});
}

async function dirFinal(){

  const stars = [plus, !D.creditEver, !D.scandal && D.left === 0];

  panel.innerHTML = ''; panel.append(dirHead('Итоги года'));
  const card = el('div','card');
  card.append(el('h2', null, win ? 'Год закрыт в плюсе' : 'Цель не достигнута'));

  [['Год в плюсе', 'на счёте больше, чем было в январе (100 000 ₽)'], ['Без кредита', 'ни разу не занимали у банка'], ['Команда сохранена', 'ни один мастер не ушёл']].forEach(([t, s], i) => {
    const li = el('li', stars[i] ? 'on' : null); li.append(el('b', null, (stars[i] ? '★ ' : '☆ ') + t), el('span', null, ' — ' + s)); ul.append(li);
  });
  card.append(ul, el('p', null, 'На счёте в конце года: <b>' + rub(Math.round(D.cash)) + '</b>. Прибыль за год: <b>' + (D.cash < 100000 ? '−' : '') + rub(Math.abs(Math.round(D.cash - 100000))) + '</b> — это ' + rub(Math.max(0, Math.round((D.cash - 100000) / 12))) + ' в месяц на Тамару Петровну вместе с её собственными стрижками.'));
  panel.append(card);
  const errs = D.log.filter(x => !x.ok);
  if (errs.length){
    const w = el('div','card'); w.append(el('h2', null, 'Работа над ошибками'));
    const l = el('ul'); errs.forEach(x => { const li = el('li'); li.append(el('span', null, DIR_MON[x.m] + ': ' + x.ev + ' '), el('br'), el('b', null, 'Лучше: '), document.createTextNode(x.best || '')); l.append(li); });
    w.append(l); panel.append(w);
  }
  panel.append(el('p','dirDisc','Цифры и налоги — игровая механика по правилам 2026 года. Для реальных решений сверяйтесь с актуальными данными Правительства РФ и бухгалтером.'));
  fitStage();
  C.tamara.pose = 'stand'; place('tamara'); mood('tamara', win ? 'warm' : 'doubt');
  ayaState(win ? 'praise' : 'explain'); await say('aya', dirA(win ? 435 : 436));
