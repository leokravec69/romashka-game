  try { const b = JSON.parse(localStorage.getItem('romashka_director_best') || '0'); const sc = stars.filter(Boolean).length; if (sc > b) localStorage.setItem('romashka_director_best', JSON.stringify(sc)); } catch(e){}
  dirEndButtons();
}

function charsShow(){
  track('chars');
  S = fresh(); resetScene(); hud(); stopVoice(); hideDlg(); setLocation2('entrance'); clips(false);
  vis('marina', false); pose('kira','stand'); setPos('kira', 760, 700); face('kira', 1); vis('kira', true);
  C.eric.pose = 'stand'; setPos('eric', 1120, 700); face('eric', -1); vis('eric', true); camSet(940);
  panel.innerHTML = '';
  const h = el('div','head'); h.append(el('h1', null, 'Персонажи'), el('span','step','Кто есть кто')); panel.append(h);
  const tabs = el('div','chTabs'), list = el('div','chList');
  const show = gi => {
    [...tabs.children].forEach((t, k) => t.setAttribute('aria-selected', k === gi));
    list.innerHTML = '';
    CHARS[gi].items.forEach(p => {
      const c = el('div','chCard');
      const ph = el('div','chPh' + (p.round ? ' round' : '')); const im = el('img'); im.src = IMG(p.img); im.alt = p.name; im.loading = 'lazy'; ph.append(im);
      const tx = el('div','chTx');
      tx.append(el('b', null, p.name), el('span','chSub', p.sub), el('span','chWhere', '📍 ' + p.where));
      const d = el('p','chD'); d.textContent = p.d; tx.append(d);
      if (p.stats){
        const st = el('div','hsStats');
        p.stats.forEach(([k, v]) => { const r = el('div','hsStat'); r.append(el('span', null, k)); const bar = el('i'); for (let n = 0; n < 5; n++) bar.append(el('b', n < v ? 'on' : null)); r.append(bar); st.append(r); });
        tx.append(st);
      }
      if (p.lim){ const l = el('p','chT'); l.textContent = 'Предел: ' + p.lim; tx.append(l); }
      if (p.teach){ const l = el('p','chT'); l.textContent = 'Чему учит: ' + p.teach; tx.append(l); }
      c.append(ph, tx); list.append(c);
    });
    fitStage();
  };
  CHARS.forEach((g, gi) => { const t = el('button','chTab', g.g + ' · ' + g.items.length); t.type = 'button'; t.setAttribute('role','tab'); t.onclick = () => show(gi); tabs.append(t); });
  tabs.setAttribute('role','tablist');
  const back = el('button','backBtn','← В меню'); back.type = 'button'; back.onclick = () => restart(false);
  panel.append(tabs, list, back); show(0);
}

/* сборка списка клиентов для цикла */
function pjBuild(cyc){
  const p = pjGet(), base = MEN.filter(v => v.salon === 'pijon'), lost = cyc === 3 ? pjLost(p) : [];
  const out = [];
  base.forEach(b => {
    const [name, age] = PJ_NAMES[b.img] || [b.name, b.age];
    if (cyc === 2){
      const d = PJ2[b.img]; if (!d) return;
      const bad = (p.out[1] || {})[b.img] === 'bad' ? 1 : 0, bi = d.best.length > 1 ? bad : 0;
      out.push({salon:'pijon', master:'eric', img:b.img, w:b.w, h:b.h, name, age, title:d.title, enter:'Месяц спустя. ' + d.enter, line:d.line[bad], lineNote:'',
        chair:[], fin:d.fin, ayaFin:pjA(d.ayaFin), clean:d.clean, phone:d.phone, prevBad:!!bad,
        d1:{title:d.d1title || 'ответ на отзыв', opts:[pjO(true, d.best[bi], d.bestPts || 12, pjA(d.bestAya[bi]))].concat(d.err.map(e => pjO(false, e.t, e.pts, pjA(e.aya))))},
        d2:{title:d.d2.title, intro:d.d2.intro, opts:d.d2.opts.map(e => pjO(e.ok, e.t, e.pts, pjA(e.aya)))}});
    } else if (cyc === 3){
      if (b.img === 'denis' || b.img === 'vadim') return;          // они придут вместе — в тупике
      if (lost.includes(b.img)) return;
      const d = PJ3[b.img]; if (!d) return;
      out.push({salon:'pijon', master:'eric', img:b.img, w:b.w, h:b.h, name, age, title:d.title, enter:d.pre || ('Ещё месяц. ' + name + ' — уже свой клиент.'), line:d.line, lineNote:'',
        chair:[], fin:d.fin, ayaFin:'', clean:d.clean,
        d1:{title:d.d1.title, opts:d.d1.opts.map(e => pjO(e.ok, e.t, e.pts, pjA(e.aya)))},
        d2:{title:d.d2.title, intro:d.d2.intro, opts:d.d2.opts.map(e => pjO(e.ok, e.t, e.pts, pjA(e.aya)))}});
    }
  });
  return out;
}

/* отдельное решение (уборка, телефон, тупик) — тот же вид, что выбор ответа */
function pjDecide(title, sub, opts, opt = {}){
  return new Promise(res => {
    panel.innerHTML = ''; panel.append(menHead(title, MV.i + (opt.after ? 0 : 1), MV.list.length));
    const s = el('p','menStep'); s.textContent = sub; panel.append(s);
    const list = el('div','choices'); list.setAttribute('role','group');
    shuffle(opts).forEach(c => {
      const b = el('button','choice'); b.type = 'button';
      b.innerHTML = '<span class="k" aria-hidden="true"></span><span></span>'; b.lastChild.textContent = c.t;
      b.onclick = async () => {
        [...list.children].forEach(x => x.disabled = true); b.classList.add('picked'); clearHeld();
        if (!opt.noMeter){ S.meter = clamp(S.meter + c.pts, -100, 100); hud(); }
        if (c.ok) S.xPts = (S.xPts || 0) + 2;
        const best = opts.find(x => x.ok);
        if (best) MV.log.push({title:sub, picked:c.t, ok:!!c.ok, d:c.ok ? 0 : c.pts, aya:c.aya, best:c.ok ? null : best.t});
        const q = c.t.match(/«[^«»]*(?:«[^«»]*»[^«»]*)*»/g) || [];
        if (q.length) for (const x of q) await say(MV.master, x.slice(1, -1));
        else await say(MV.master, 'Действие: ' + c.t.charAt(0).toLowerCase() + c.t.slice(1) + '.', {narr:true});
        if (opt.onPick) await opt.onPick(c);
        const fb = el('div','chips'); if (!opt.noMeter) fb.append(el('span', 'chip ' + (c.pts >= 0 ? 'plus' : 'minus'), 'Настроение ' + (c.pts >= 0 ? '+' + c.pts : String(c.pts).replace('-','−'))));
        panel.append(fb);
        if (c.aya){ ayaTail(c.aya, c.ok ? 'praise' : 'warn'); const h = el('div','hint','<b>Айя:</b>&nbsp;'); h.append(document.createTextNode(c.aya)); panel.append(h); }
        if (!c.ok && best){ const bb = el('div','hint best','<b>Лучше:</b>&nbsp;'); bb.append(document.createTextNode(best.t)); panel.append(bb); }
        const nx = el('button','next','Дальше'); nx.type = 'button'; nx.onclick = () => { nx.disabled = true; stopVoice(); hideDlg(); res(c); };
        panel.append(nx); fitStage(); nx.focus({preventScroll:true});
      };
      list.append(b);
    });
    panel.append(list); fitStage();
  });
}

      if (/попробую/.test(c.t)){ await say('eric', 'Эрик стрижёт кудри как фейд — слои не ложатся. Денис молча смотрит в зеркало.', {narr:true}); mood('client', 'sad'); }
      else if (/Дэну/.test(c.t)){ pjStaff('den', 1300, true); await say('den', 'Бро, я тоже длину не делаю. У нас никто не делает.'); pjStaff('den', 0, false); }
      else { await say('client', 'Я ждал три месяца…'); mood('client', 'sad'); }
    }});
  await walk('client', P.door[0], 690, {cam:narrow()}); vis('client', false);
  pjStaff('grisha', 1250, true); if (SP.grisha.coffee){ C.grisha.pose = 'coffee'; place('grisha'); }
  await say('eric', 'Клиенты уходят. Гриша ставит кофе перед Эриком и открывает ноутбук.', {narr:true});
  if (SP.grisha.laptop){ C.grisha.pose = 'laptop'; place('grisha'); }
  await say('grisha', 'Четыре клиента за три месяца. Это минус семь тысяч в месяц только по стрижкам. И сарафанное радио в другую сторону.');
  if (SP.eric.tired){ C.eric.pose = 'tired'; place('eric'); }
  const h = await pjDecide('Решение героя', 'Что дальше?', [
    pjO(true,'«Я понял. Пойду на повышение квалификации в Академию. Длина, кудри — и буду брать таких клиентов сам»',0,pjA(322)),
    pjO(false,'«Я понял. Но я барбер, моя история — бороды и фейды. Длину пусть делают другие, а я буду лучшим в своём»',0,pjA(323)),
    pjO(false,'«Я понял. Научусь по роликам — там сейчас всё есть, и бесплатно»',0,pjA(324))], {noMeter:true, after:true});
  C.eric.pose = 'stand'; place('eric');
  if (h.ok){ C.grisha.pose = 'stand'; place('grisha'); await say('grisha', 'Графики подвинем. Учись.', {mood:'happy'}); }
  else await say('grisha', 'Как знаешь.', {mood:'skeptic'});
  pjStaff('grisha', 0, false);
  ayaState('explain'); await say('aya', pjA(325));
  return h.ok;
}
/* никто не вернулся — начинаем «Пижон» заново */
async function pjNobody(){
  saveClear('eric');
  setLocation2('barber_pijon'); clips(false); ['kira','eric','tamara','narc','ab','client'].forEach(x => vis(x, false));
  C.eric.pose = 'stand'; setPos('eric', 900, 690); face('eric', 1); vis('eric', true); camSet(1000);
  panel.innerHTML = ''; panel.append(menHead('«Пижон», цикл 3', 0), el('p','wait','Смотрите сцену…'));
  pjStaff('grisha', 1250, true); if (SP.grisha.laptop){ C.grisha.pose = 'laptop'; place('grisha'); }
  await say('grisha', 'Ни один клиент не записался снова. Таблица пустая. Давай начнём сначала: новые люди, новый шанс — и разбор ошибок.', {mood:'sad'});
  ayaState('warn'); await say('aya', pjA(328));
  panel.innerHTML = ''; panel.append(menHead('«Пижон», цикл 3', 0));
  const again = el('button','next','Начать «Пижон» заново'); again.type = 'button';
  again.onclick = () => { try { localStorage.removeItem(PJ_KEY); } catch(e){} menStart('eric', MV.career, 'pijon'); };
  const menu = el('button','next alt','В меню'); menu.type = 'button'; menu.onclick = () => restart(false);
  const row = el('div','btnrow'); row.append(menu, again); panel.append(row); fitStage();
}
/* итог цикла: Гриша и таблица повторных записей */
async function pjCycleEnd(){
  const p = pjGet(), cyc = MV.cycle;
  p.done = Math.max(p.done, cyc);
  const lost = pjLost(p);
  if (cyc === 3){ p.passed = (8 - lost.length) >= 6 && !!MV.upskill; if (MV.upskill) p.up = true; }
  pjPut(p);
  /* уборка в конце смены */
  if (SP.eric.sweep){ C.eric.pose = 'sweep'; place('eric'); }
  await say('eric', 'Конец смены. Эрик подметает, чистит и смазывает машинку, раскладывает инструмент на завтра.', {narr:true});
  C.eric.pose = 'stand'; place('eric');
  pjStaff('grisha', 1250, true);
  const notes = [];
  if (MV.phoneNote === 'call') notes.push('Одно замечание — телефон.');
  if (MV.phoneNote === 'away') notes.push('Замечаний нет.');
  if (MV.dirty) notes.push('Утром Дэн нашёл твои волосы в машинке.'); else notes.push('Рабочее место — в порядке.');
  const ret = Object.values(p.out[cyc] || {}).filter(x => x !== 'bad').length;
  notes.push('Довольны или нейтральны: ' + ret + ' из ' + Object.keys(p.out[cyc] || {}).length + '.');
  await say('grisha', notes.join(' '), {mood: MV.phoneNote === 'call' || MV.dirty ? 'skeptic' : 'happy'});
  if (cyc === 3 && lost.length) await say('grisha', lost.map(k => (PJ_NAMES[k] || [k])[0]).join(', ') + ' больше не записывается. Посмотрим, почему?');
  pjStaff('grisha', 0, false);
  ayaState('explain');
  if (cyc === 1) await say('aya', pjA(326));
  else if (cyc === 2) await say('aya', pjA(327));
  else await say('aya', p.passed ? pjA(329) : pjA(330));
  await say('aya', pjA(331));
  return p;
}

/* фоновая подгрузка всех картинок (по 4 одновременно), чтобы смена поз не мигала */
(function preloadAll(){
  const list = (typeof ASSET_LIST !== 'undefined') ? ASSET_LIST.slice() : [];
  const one = () => {
    const n = list.shift(); if (!n) return;
    const im = new Image();
    im.onload = () => { NAT[n] = [im.naturalWidth, im.naturalHeight]; Object.keys(C).forEach(id => { if (spec(id)[0] === n) place(id); }); one(); };
    im.onerror = one; im.src = IMG(n);
  };
  setTimeout(() => { for (let k = 0; k < 4; k++) one(); }, 400);
})();
restart(false);
})();

(function(){
  const b=document.getElementById('fsBtn'), d=document.documentElement;
  const req=d.requestFullscreen||d.webkitRequestFullscreen, exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(!req||!b) return; b.hidden=false;
  const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const sync=()=>{ b.textContent=isFs()?'Свернуть':'На весь экран'; };
  b.addEventListener('click',()=>{ try{ const r=isFs()?exit.call(document):req.call(d); if(r&&r.catch) r.catch(()=>{ b.textContent='Недоступно здесь'; }); }catch(e){ b.textContent='Недоступно здесь'; } });
  document.addEventListener('fullscreenchange',sync); document.addEventListener('webkitfullscreenchange',sync);
})();

/* кнопка «Сначала»: второе нажатие в течение 3 секунд перезапускает игру с главного экрана */
(function(){
  const b = document.getElementById('rstBtn'); if (!b) return;
  if (innerWidth < 560) b.textContent = '⟲';
  let armed = false, t = 0;
  b.addEventListener('click', e => {
    e.stopPropagation();
    if (!armed){ armed = true; b.textContent = innerWidth < 560 ? 'Точно?' : 'Точно? Нажмите ещё'; b.classList.add('armed'); t = setTimeout(() => { armed = false; b.textContent = innerWidth < 560 ? '⟲' : '⟲ Сначала'; b.classList.remove('armed'); }, 3000); return; }
    clearTimeout(t); try { location.reload(); } catch(err){ location.href = location.href; }
  });
})();
